<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Pokéweb – Browse Pokémon</title>
      <link rel="stylesheet" href="../css/catalogue-styles.css" />
   </head>
   <body>
      <!-- Heart icon, defined once and reused by every card -->
      <svg width="0" height="0" style="position: absolute" aria-hidden="true">
         <symbol id="heart" viewBox="0 0 24 24">
            <path
               d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
            />
         </symbol>
      </svg>

      <header class="site-header">
         <a class="brand" href="#">POKÉWEB</a>

         <nav class="main-nav" aria-label="Main">
            <a href="#" aria-current="page">Pokémon</a>
            <a href="#">Favourites</a>
            <a href="#">Games</a>
         </nav>

         <form class="search" role="search">
            <label class="visually-hidden" for="search">Search Pokémon</label>
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="Search Pokémon…" />
         </form>
      </header>

      <main class="page">
         <section class="filters" aria-label="Filters">
            <h2 class="filters-title">FILTERS</h2>
            <div class="filters-row">
               <label class="visually-hidden" for="generation"
                  >Generation</label
               >
               <select id="generation">
                  <option value="">Generation</option>
                  <option>I</option>
                  <option>II</option>
                  <option>III</option>
                  <option>IV</option>
                  <option>V</option>
                  <option>VI</option>
                  <option>VII</option>
                  <option>VIII</option>
                  <option>IX</option>
               </select>

               <label class="visually-hidden" for="type">Type</label>
               <select id="type">
                  <option value="">Type</option>
                  <option>Normal</option>
                  <option>Fire</option>
                  <option>Water</option>
                  <option>Electric</option>
                  <option>Grass</option>
                  <option>Ice</option>
                  <option>Fighting</option>
                  <option>Poison</option>
                  <option>Ground</option>
                  <option>Flying</option>
                  <option>Psychic</option>
                  <option>Bug</option>
                  <option>Rock</option>
                  <option>Ghost</option>
                  <option>Dragon</option>
                  <option>Dark</option>
                  <option>Steel</option>
                  <option>Fairy</option>
               </select>

               <label class="visually-hidden" for="region">Region</label>
               <select id="region">
                  <option value="">Region</option>
                  <option>Kanto</option>
                  <option>Johto</option>
                  <option>Hoenn</option>
                  <option>Sinnoh</option>
                  <option>Unova</option>
                  <option>Kalos</option>
                  <option>Alola</option>
                  <option>Galar</option>
                  <option>Paldea</option>
               </select>

               <label class="visually-hidden" for="sort">Sort</label>
               <select id="sort">
                  <option value="">Sort</option>
                  <option>Number (low to high)</option>
                  <option>Number (high to low)</option>
                  <option>Name (A–Z)</option>
                  <option>Name (Z–A)</option>
               </select>
            </div>
         </section>

         <h1 class="results-heading">
            Pokémon <span aria-hidden="true">•</span> 1,025 results
         </h1>

         <ul class="card-grid">
            <li class="card">
               <!-- placeholder for <img src="..." alt="Bulbasaur"> example -->
               <div class="card-image"></div>
               <div class="card-info">
                  <h2 class="card-name">
                     <span class="dex-number">#001</span> Bulbasaur
                  </h2>
                  <label class="fav">
                     <input type="checkbox" aria-label="Favourite Bulbasaur" />
                     <svg aria-hidden="true"><use href="#heart" /></svg>
                  </label>
               </div>
            </li>

            <li class="card">
               <div class="card-image"></div>
               <div class="card-info">
                  <h2 class="card-name">
                     <span class="dex-number">#004</span> Charmander
                  </h2>
                  <label class="fav">
                     <input type="checkbox" aria-label="Favourite Charmander" />
                     <svg aria-hidden="true"><use href="#heart" /></svg>
                  </label>
               </div>
            </li>

            <li class="card">
               <div class="card-image"></div>
               <div class="card-info">
                  <h2 class="card-name">
                     <span class="dex-number">#007</span> Squirtle
                  </h2>
                  <label class="fav">
                     <input type="checkbox" aria-label="Favourite Squirtle" />
                     <svg aria-hidden="true"><use href="#heart" /></svg>
                  </label>
               </div>
            </li>

            <li class="card">
               <div class="card-image"></div>
               <div class="card-info">
                  <h2 class="card-name">
                     <span class="dex-number">#025</span> Pikachu
                  </h2>
                  <label class="fav">
                     <input type="checkbox" aria-label="Favourite Pikachu" />
                     <svg aria-hidden="true"><use href="#heart" /></svg>
                  </label>
               </div>
            </li>

            <li class="card">
               <div class="card-image"></div>
               <div class="card-info">
                  <h2 class="card-name">
                     <span class="dex-number">#133</span> Eevee
                  </h2>
                  <label class="fav">
                     <input type="checkbox" aria-label="Favourite Eevee" />
                     <svg aria-hidden="true"><use href="#heart" /></svg>
                  </label>
               </div>
            </li>

            <li class="card">
               <div class="card-image"></div>
               <div class="card-info">
                  <h2 class="card-name">
                     <span class="dex-number">#150</span> Mewtwo
                  </h2>
                  <label class="fav">
                     <input type="checkbox" aria-label="Favourite Mewtwo" />
                     <svg aria-hidden="true"><use href="#heart" /></svg>
                  </label>
               </div>
            </li>

            <li class="card">
               <div class="card-image"></div>
               <div class="card-info">
                  <h2 class="card-name">
                     <span class="dex-number">#152</span> Chikorita
                  </h2>
                  <label class="fav">
                     <input type="checkbox" aria-label="Favourite Chikorita" />
                     <svg aria-hidden="true"><use href="#heart" /></svg>
                  </label>
               </div>
            </li>

            <li class="card">
               <div class="card-image"></div>
               <div class="card-info">
                  <h2 class="card-name">
                     <span class="dex-number">#155</span> Cyndaquil
                  </h2>
                  <label class="fav">
                     <input type="checkbox" aria-label="Favourite Cyndaquil" />
                     <svg aria-hidden="true"><use href="#heart" /></svg>
                  </label>
               </div>
            </li>

            <li class="card">
               <div class="card-image"></div>
               <div class="card-info">
                  <h2 class="card-name">
                     <span class="dex-number">#158</span> Totodile
                  </h2>
                  <label class="fav">
                     <input type="checkbox" aria-label="Favourite Totodile" />
                     <svg aria-hidden="true"><use href="#heart" /></svg>
                  </label>
               </div>
            </li>
         </ul>

         <nav class="pagination" aria-label="Pagination">
            <a href="#" aria-label="Previous page">‹</a>
            <a href="#" aria-current="page">1</a>
            <a href="#">2</a>
            <a href="#">3</a>
            <a href="#">4</a>
            <a href="#">5</a>
            <a href="#" aria-label="Next page">›</a>
         </nav>
      </main>
   </body>
</html>
